<!doctype html><meta charset="utf-8">
<!-- The source of .github/hero.png and hero-dark.png: 1280×640, rendered at 2× (add #dark for the dark one). The name and what it is,
     in one size and one weight, the way KK's own fuckgrechka opens; the name carries the review page's yellow mark, the only colour.
     Nothing else: on a phone the README is about 360 px wide, so the type is about 33 px there, and anything beside it would be a few pixels. -->
<style>
@font-face { font-family: "Commissioner"; src: url("Commissioner-Latin.woff2") format("woff2"); font-weight: 200 800; }
:root { --ground: #ffffff; --ink: #111111; --mark: #ffd60a; }
:root.dark { --ground: #0d1117; --ink: #e6edf3; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1280px; height: 640px; overflow: hidden; }
body { position: relative; background: var(--ground); color: var(--ink); font-family: "Commissioner", sans-serif; -webkit-font-smoothing: antialiased; }
h1 { position: absolute; left: 64px; top: 58px; font-size: 118px; line-height: .98; font-weight: 700; letter-spacing: -.045em; margin-left: -.04em; }
h1 mark { background: linear-gradient(transparent 17%, var(--mark) 17%, var(--mark) 89%, transparent 89%); color: inherit; padding: 0 .07em; margin-left: -.07em; border-radius: .05em; }
:root.dark h1 mark { color: #111; }
</style>
<script>if (location.hash === '#dark') document.documentElement.classList.add('dark');</script>
